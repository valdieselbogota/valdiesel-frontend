<style>
  :root {
    --brand-red: #E8443C; --brand-red-700: #D6392F;
    --vd-gold: #b68235; --vd-gold-700: #7d5a24;
    --vd-surface: #eae9e9; --vd-text: #201f1d; --vd-muted: #6b6862; --vd-divider: #d8d5d0;
    --vd-heading: 'Cormorant Garamond', Georgia, serif;
    --vd-body: 'Lora', Georgia, serif;
    --vd-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .vd { font-family: var(--vd-body); color: var(--vd-text); }
  .vd h1, .vd h3, .vd h6 { font-family: var(--vd-heading); font-weight: 400; margin: 0; }
  .vd h6 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
  .vd .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .vd .muted { color: var(--vd-muted); }
  .vd .plate { border: 6px solid var(--vd-surface); background: var(--vd-surface); display: block; }
  .vd .vd-btn { font-family: var(--vd-body); font-weight: 400; font-size: 14px; background: transparent;
    border: 1px solid var(--vd-divider); color: var(--vd-text); border-radius: 4px; padding: 11px 20px;
    transition: transform .3s var(--vd-ease), border-color .3s ease, background .3s ease; }
  .vd .vd-btn:hover { transform: translateY(-1px); }
  .vd .vd-btn:active { transform: translateY(1px); }
  .vd .vd-btn-red { color: var(--brand-red-700); border-color: var(--brand-red); }
  .vd .vd-btn-red:hover { background: rgba(232,68,60,0.06); }
  .vd .vd-btn-gold { color: var(--vd-gold-700); border-color: var(--vd-gold); }
  .vd .vd-btn-gold:hover { background: rgba(182,130,53,0.08); }
  .vd .vd-btn-block { display: block; width: 100%; }
  .vd .vd-card { border: 1px solid var(--vd-divider); border-radius: 4px; background: transparent;
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
    transition: transform .3s var(--vd-ease), border-color .3s ease, box-shadow .3s ease; }
  .vd .vd-card-hover:hover { transform: translateY(-4px); border-color: var(--brand-red); box-shadow: 0 6px 18px rgba(32,31,29,0.08); }
  .vd .vd-sec-title { color: var(--brand-red-700); border-bottom: 2px solid var(--brand-red); padding-bottom: 4px; align-self: flex-start; }
  .vd .vd-red-icon { filter: invert(31%) sepia(64%) saturate(2200%) hue-rotate(338deg) brightness(93%) contrast(92%); }
  .vd input, .vd select { font-family: var(--vd-body); }
  .vd input:focus, .vd select:focus { outline: none; }
  @keyframes vdUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes vdPlate { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
  @keyframes vdRule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes vdMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .vd *, .vd *::before, .vd *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  @media (max-width: 720px) {
    .vd .vd-hero { grid-template-columns: 1fr !important; }
    .vd .vd-hero h1 { font-size: 32px !important; }
    .vd .vd-trust { grid-template-columns: 1fr !important; }
    .vd .vd-trust > div { border-right: 0 !important; }
    .vd .vd-cats, .vd .vd-grid { grid-template-columns: 1fr 1fr !important; }
    .vd .vd-advice { flex-direction: column !important; align-items: flex-start !important; }
    .vd .vd-btn { min-height: 48px; }
    .vd .vd-search { flex-wrap: wrap; }
  }
</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', sans-serif; background: #F3F4F6; color: #4A5560; min-height: 100vh; position: relative; overflow-x: hidden; }
  body::before {
    content: '';
    position: absolute;
    top: -120px; left: 50%;
    transform: translateX(-50%);
    width: 900px; height: 400px;
    background: radial-gradient(ellipse at center, rgba(232,68,60,0.16) 0%, rgba(232,68,60,0) 70%);
    filter: blur(40px);
    pointer-events: none;
    z-index: -1;
  }
  .brand { font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: -0.02em; }
  .accent { color: #E8443C; }
  input, select {
    width: 100%; background: #F3F4F6; border: 1px solid #D7DBE1; border-radius: 6px;
    padding: 10px 12px; color: #1A2229; font-family: 'Montserrat', sans-serif; font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: #E8443C; }
  button { cursor: pointer; border: none; font-family: 'Montserrat', sans-serif; font-weight: 500; }
  .btn-primary { background: linear-gradient(135deg, #EF5A50 0%, #D6392F 100%); color: #FFF6F5; border-radius: 6px; padding: 10px 18px; font-size: 14px; transition: filter 0.15s; }
  .btn-primary:hover { filter: brightness(0.94); }
  .btn-ghost { background: transparent; border: 1px solid #D7DBE1; color: #4A5560; border-radius: 6px; padding: 8px 14px; font-size: 13px; }
  .btn-ghost:hover { border-color: #E8443C; color: #E8443C; }
  .card { background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 10px; border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 8px 24px rgba(20,30,40,0.10); }
  .product-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(20,30,40,0.12); }
  @keyframes cartBump { 0% { transform: scale(1); } 35% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .cart-bump { animation: cartBump 0.35s ease; }
  ::placeholder { color: #97A0AA; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  .hidden { display: none !important; }
  a { color: #E8443C; text-decoration: none; }
  .navlink { font-size: 13px; color: #5B6672; cursor: pointer; padding-bottom: 2px; }
  .navlink.active { color: #1A2229; border-bottom: 2px solid #E8443C; }
  .navlink:hover { color: #1A2229; }
</style>

let PRODUCTS = [];
let productsLoaded = false;

async function loadProducts() {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4000);
    const res = await fetch(API_BASE + '/api/products', { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    PRODUCTS = data.length ? data : PRODUCTS_FALLBACK;
  } catch (e) {
    PRODUCTS = PRODUCTS_FALLBACK;
  }
  PRODUCTS.forEach(p => { if (PRODUCT_IMAGES[p.code]) p.image = PRODUCT_IMAGES[p.code]; });
  productsLoaded = true;
}
const fmt = (n) => new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0}).format(n);

let currentView = 'home';
let session = null;
let publicCart = {};
let clientCart = {};
let visibleCount = 30;
const PAGE_SIZE = 30;

function activeCartRef() {
  return (session && !session.isAdmin) ? clientCart : publicCart;
}

function cartItemCount() {
  return Object.values(activeCartRef()).reduce((s,i) => s + i.qty, 0);
}

function renderNav() {
  const items = [
    {id:'home', label:'Inicio'},
    {id:'catalogo', label:'Catálogo'},
    {id:'nosotros', label:'Quiénes somos'},
    {id:'portal', label: session ? (session.isAdmin ? 'Panel admin' : 'Mi cuenta') : 'Portal clientes'}
  ];
  const count = cartItemCount();
  document.getElementById('navlinks').innerHTML = items.map(i =>
    `<span class="navlink ${currentView===i.id?'active':''}" onclick="showView('${i.id}')">${i.label}</span>`
  ).join('') +
  `<span style="position:relative;cursor:pointer;display:flex;align-items:center;" onclick="showView('carrito')">
    <i class="ti ti-shopping-cart" style="font-size:19px;color:#1A2229;" aria-hidden="true"></i>
    ${count > 0 ? `<span style="position:absolute;top:-8px;right:-8px;background:#E8443C;color:#FFF6F5;font-size:10px;font-weight:600;border-radius:999px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;">${count}</span>` : ''}
  </span>` +
  (session ? `<button class="btn-ghost" onclick="logout()">Cerrar sesión</button>` : '');
}

function renderView(view) {
  currentView = view;
  renderNav();
  const app = document.getElementById('app');
  if (view === 'home') { app.innerHTML = viewHome(); populateBrandFilter('brand-filter-home'); }
  if (view === 'catalogo') { app.innerHTML = viewCatalog(); populateBrandFilter('brand-filter-pub'); renderPublicGrid(); }
  if (view === 'nosotros') app.innerHTML = viewAbout();
  if (view === 'carrito') app.innerHTML = viewCart();
  if (view === 'portal') {
    if (!session) { app.innerHTML = viewLogin(); }
    else if (session.isAdmin) { app.innerHTML = viewAdmin(); loadClientList(); }
    else { app.innerHTML = viewClientPortal(); populateBrandFilter('brand-filter-cli'); renderClientGrid(); }
  }
  window.scrollTo(0,0);
}

function showView(view) {
  if (view !== currentView) {
    history.pushState({ view }, '', '#' + view);
  }
  renderView(view);
}

window.addEventListener('popstate', (e) => {
  const view = (e.state && e.state.view) || 'home';
  renderView(view);
});

function viewCart() {
  const isClient = session && !session.isAdmin;
  const cart = activeCartRef();
  const items = Object.values(cart);
  const priceOf = p => isClient ? priceForClient(p.price) : p.price;
  const total = items.reduce((s,i) => s + i.qty * priceOf(i.product), 0);

  if (!items.length) {
    return `
      <div style="text-align:center;padding:60px 20px;">
        <i class="ti ti-shopping-cart-off" style="font-size:40px;color:#C6CBD2;" aria-hidden="true"></i>
        <p style="font-size:15px;color:#1A2229;margin:16px 0 6px;">Tu carrito está vacío</p>
        <p style="font-size:13px;color:#8993A0;margin:0 0 20px;">Agrega productos desde el catálogo o el inicio.</p>
        <button class="btn-primary" onclick="showView('catalogo')">Ver catálogo</button>
      </div>
    `;
  }

  const rows = items.map(i => `
    <div class="card" style="display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;">
      <div style="width:44px;height:44px;background:#F3F4F6;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i class="ti ti-settings" style="font-size:20px;color:#C6CBD2;" aria-hidden="true"></i>
      </div>
      <div style="flex:1;min-width:0;">
        <p style="font-size:13px;font-weight:500;color:#1A2229;margin:0;line-height:1.3;">${i.product.name}</p>
        <p style="font-size:11px;color:#97A0AA;margin:2px 0 0;">Ref: ${i.product.code} · ${fmt(priceOf(i.product))} c/u</p>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="btn-ghost" style="width:26px;padding:2px;" onclick="cartChangeQty(${i.product.id},-1)">-</button>
        <span style="font-size:13px;min-width:16px;text-align:center;">${i.qty}</span>
        <button class="btn-ghost" style="width:26px;padding:2px;" onclick="cartChangeQty(${i.product.id},1)">+</button>
      </div>
      <p style="font-size:14px;font-weight:600;color:#1A2229;min-width:70px;text-align:right;margin:0;">${fmt(i.qty*priceOf(i.product))}</p>
      <button onclick="cartRemove(${i.product.id})" style="background:none;border:none;color:#97A0AA;cursor:pointer;padding:4px;">
        <i class="ti ti-trash" style="font-size:16px;" aria-hidden="true"></i>
      </button>
    </div>
  `).join('');

  return `
    <p style="font-size:18px;font-weight:600;color:#1A2229;margin-bottom:16px;">Tu carrito</p>
    ${rows}
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:16px;margin-top:12px;">
      <div>
        <p style="font-size:12px;color:#8993A0;margin:0;">Total</p>
        <p style="font-size:20px;font-weight:700;color:#1A2229;margin:0;">${fmt(total)}</p>
      </div>
      <button class="btn-primary" onclick="cartCheckout()">Finalizar pedido</button>
    </div>
    <div id="checkout-msg-cart" style="font-size:13px;color:#7BC97B;text-align:center;margin-top:16px;"></div>
  `;
}

function cartChangeQty(id, delta) {
  const cart = activeCartRef();
  const p = PRODUCTS.find(x => x.id === id);
  if (!cart[id]) cart[id] = {qty:0, product:p};
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  showView('carrito');
}

function cartRemove(id) {
  delete activeCartRef()[id];
  showView('carrito');
}

async function cartCheckout() {
  const isClient = session && !session.isAdmin;
  if (isClient) { await checkoutClientFrom('checkout-msg-cart'); }
  else { await checkoutPublicFrom('checkout-msg-cart'); }
}

const VD_TRUST = [
  { title: 'Amplio portafolio',       body: 'Cientos de referencias en 16 marcas', icon: 'boxes.svg' },
  { title: 'Envíos a nivel nacional', body: 'Despachos seguros a todo el país',    icon: 'truck.svg' },
  { title: 'Repuestos garantizados',  body: 'Respaldo en cada pieza que vendemos', icon: 'shield-check.svg' }
];

/* El catálogo no trae categoría, así que se deduce del nombre de la pieza. */
const VD_CATEGORIES = [
  { name: 'Motor',       icon: 'cog.svg',         test: /bomba|inyector|piston|anillo|culata|arbol|cigue|valvula|empaque|turbo|exosto/i },
  { name: 'Embrague',    icon: 'disc.svg',        test: /embrague|clutch|prensa|balinera|collarin/i },
  { name: 'Frenos',      icon: 'circle-stop.svg', test: /freno|banda|pastilla|campana|zapata/i },
  { name: 'Filtros',     icon: 'filter.svg',      test: /filtro|aire|racor/i },
  { name: 'Transmisión', icon: 'git-fork.svg',    test: /caja|cardan|corona|pi[ñn]on|diferencial|homocinetica|transmis/i }
];

function vdCategoryCounts() {
  const counts = {};
  VD_CATEGORIES.forEach(c => counts[c.name] = 0);
  PRODUCTS.forEach(pr => { const c = VD_CATEGORIES.find(c => c.test.test(pr.name || '')); if (c) counts[c.name]++; });
  return counts;
}

function vdCategory(name) {
  showView('catalogo');
  setTimeout(() => {
    document.getElementById('search-pub').value = name;
    visibleCount = PAGE_SIZE;
    renderPublicGrid();
  }, 0);
}

function vdFeatured() {
  const conFoto = PRODUCTS.filter(pr => pr.image);
  const resto = PRODUCTS.filter(pr => !pr.image);
  return conFoto.concat(resto).slice(0, 8);
}

function vdAdd(evt, id) {
  const pr = PRODUCTS.find(x => x.id === id);
  if (!pr) return;
  const ref = activeCartRef();
  if (!ref[id]) ref[id] = { qty: 0, product: pr };
  ref[id].qty += 1;
  renderNav();
  const btn = evt.currentTarget;
  const antes = btn.textContent;
  btn.textContent = 'Agregado';
  setTimeout(() => { btn.textContent = antes; }, 900);
}

function vdProductCard(pr) {
  const locked = !session;
  return `
    <div class="vd-card vd-card-hover">
      ${pr.image
        ? `<img class="plate" src="${pr.image}" alt="${pr.name}" style="width:100%;height:92px;object-fit:cover;">`
        : `<div class="plate" style="width:100%;height:92px;display:flex;align-items:center;justify-content:center;"><img src="${VD_ICON}cog.svg" alt="" style="width:26px;height:26px;opacity:.35;"></div>`}
      <span class="num" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-red-700);">${pr.brand}</span>
      <p style="font-size:15px;margin:0;line-height:1.4;">${pr.name}</p>
      <p class="num muted" style="font-size:12px;margin:0;">Ref. ${pr.code}</p>
      ${locked
        ? `<p class="muted" style="font-size:12px;margin:0;">Precio para clientes</p>`
        : `<p class="num" style="font-family:var(--vd-heading);font-size:22px;margin:0;">${fmt(pr.price)}</p>`}
      <button class="vd-btn vd-btn-red vd-btn-block" style="padding:8px;font-size:13px;" onclick="vdAdd(event, ${pr.id})">Agregar</button>
    </div>`;
}

function goHomeSearch() {

    document.getElementById('brand-filter-pub').value = b;
    renderPublicGrid();
  }, 0);
}

function quickBrand(b) {

}

function viewAbout() {
  return `
    <div style="max-width:640px;">
      <p class="brand" style="font-size:22px;color:#1A2229;margin-bottom:16px;">Quiénes somos</p>
      <p style="font-size:14px;line-height:1.7;color:#4A5560;margin-bottom:16px;">

async function handleLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const errorEl = document.getElementById('login-error');
  if (!u || !p) { errorEl.textContent = 'Completa usuario y contraseña.'; return; }
  errorEl.style.color = '#E8443C';
  errorEl.textContent = 'Conectando...';
  try {
    const res = await fetch(API_BASE + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.error || 'No se pudo iniciar sesión.'; return; }
    session = { ...data, password: p };
    clientCart = {};
    errorEl.textContent = '';
    showView('portal');
  } catch (e) {
    errorEl.textContent = 'No se pudo conectar al servidor. Si acaba de despertar, espera unos segundos e intenta de nuevo.';
  }
}

async function createClient() {
  const u = document.getElementById('new-user').value.trim();
  const p = document.getElementById('new-pass').value.trim();
  const c = document.getElementById('new-company').value.trim() || u;
  const d = parseFloat(document.getElementById('new-discount').value) || 0;
  const m=document.getElementById('admin-msg');
  if (!u || !p) { m.style.color='#E8443C'; m.textContent='Usuario y contraseña son obligatorios.'; return; }
  try {
    const res = await fetch(API_BASE + '/api/admin/clients', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        adminUsername: session.username, adminPassword: session.password,
        username: u, password: p, company: c, discount: d
      })
    });
    const data = await res.json();
    if (!res.ok) { m.style.color='#E8443C'; m.textContent = data.error || 'No se pudo crear el cliente.'; return; }
    m.style.color='#7BC97B'; m.textContent='Cliente "' + u + '" creado.';
    document.getElementById('new-user').value=''; document.getElementById('new-pass').value='';
    document.getElementById('new-company').value=''; document.getElementById('new-discount').value='';
    loadClientList();
  } catch(e) {
    m.style.color='#E8443C';
    m.textContent = 'No se pudo conectar al servidor.';
  }
}

async function loadClientList() {
  try {
    const params = new URLSearchParams({ adminUsername: session.username, adminPassword: session.password });
    const res = await fetch(API_BASE + '/api/admin/clients?' + params);
    const clients = await res.json();
    const rows = clients.map(u =>
      '<tr><td style="padding:6px 0;">' + u.username + '</td><td>' + u.company + '</td><td>' + u.discount + '%</td></tr>'
    );
    document.getElementById('client-list').innerHTML = rows.length
      ? '<table style="width:100%;border-collapse:collapse;"><tr style="color:#8993A0;font-size:11px;text-align:left;"><td>Usuario</td><td>Empresa</td><td>Descuento</td></tr>' + rows.join('') + '</table>'
      : 'Aún no hay clientes registrados.';
  } catch(e) { document.getElementById('client-list').innerHTML = 'No se pudo conectar al servidor.'; }
  loadOrderList();
}

async function loadOrderList() {
  try {
    const params = new URLSearchParams({ adminUsername: session.username, adminPassword: session.password });
    const res = await fetch(API_BASE + '/api/admin/orders?' + params);
    const orders = await res.json();
    const rows = orders.map(o => {
      const date = new Date(o.created_at).toLocaleString('es-CO');
      return '<tr><td style="padding:6px 0;">' + date + '</td><td>' + (o.company||o.username) + '</td><td>' + o.items.length + ' items</td><td>' + fmt(o.total) + '</td></tr>';

}

function getFiltered(searchId, brandId) {
  const q = document.getElementById(searchId).value.trim().toLowerCase();
  const brand = document.getElementById(brandId).value;
  return PRODUCTS.filter(p => {
    const matchBrand = !brand || p.brand === brand;
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q);
    return matchBrand && matchQ;
  });
}

function changeQtyPublic(id, delta) {

  document.getElementById('pub-cart-count').textContent = count + (count===1?' item':' items');
  document.getElementById('pub-cart-total').textContent = fmt(total);
}

const WHATSAPP_NUMBER = '573108088686';

function buildWhatsAppMessage(order) {
  const lines = order.items.map(i => '- ' + i.qty + 'x ' + i.name + ' (Ref: ' + i.code + ') — ' + fmt(i.price * i.qty));
  const header = order.username === 'invitado'
    ? 'Hola, quiero coordinar el pago de mi pedido:'
    : 'Hola, soy ' + order.company + '. Quiero coordinar el pago de mi pedido:';
  return header + '\n\n' + lines.join('\n') + '\n\nTotal: ' + fmt(order.total);
}

function redirectToWhatsApp(order) {
  const msg = buildWhatsAppMessage(order);
  const url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg);

}

  const m=document.getElementById(msgId);
  if (!items.length) { m.style.color='#E8443C'; m.textContent='Tu carrito está vacío.'; return; }
  const total = items.reduce((s,i)=>s+i.qty*priceForClient(i.product.price),0);
  const order = { username:session.username, company:session.company, items: items.map(i=>({name:i.product.name, code:i.product.code, qty:i.qty, price:priceForClient(i.product.price)})), total };
  m.style.color='#5B6672'; m.textContent='Enviando pedido...';
  try {
    const res = await fetch(API_BASE + '/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(order)
    });
    if (!res.ok) throw new Error('bad response');
    clientCart = {};
    if (document.getElementById('product-grid-cli')) renderClientGrid();
    m.textContent = '';
    showWhatsAppModal(order);
  } catch(e) {
    m.style.color='#E8443C';
    m.textContent = 'No se pudo conectar al servidor. Si acaba de despertar, espera unos segundos e intenta de nuevo.';
  }
}
function checkoutClient() { return checkoutClientFrom('checkout-msg-cli'); }

loadProducts().then(() => {
  history.replaceState({ view: 'home' }, '', '#home');
  renderView('home');
});
</script>
