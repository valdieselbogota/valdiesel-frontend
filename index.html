<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.43.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&family=Cormorant+Garamond:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-red: #E8443C; --brand-red-700: #D6392F;
    --vd-gold: #b68235; --vd-gold-700: #7d5a24;
    --vd-surface: #eae9e9; --vd-text: #201f1d; --vd-muted: #6b6862; --vd-divider: #d8d5d0;
    --vd-heading: 'Playfair Display', Georgia, serif;
    --vd-body: 'Playfair Display', Georgia, serif;
    --vd-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    /* Alias de tokens del handoff de diseno (Paso 1: navegacion) */
    --font-heading: 'Cormorant Garamond', Georgia, serif;
    --font-body: var(--vd-body);
    --color-divider: var(--vd-divider);
    --color-text: var(--vd-text);
    --color-muted: var(--vd-muted);
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-8: 32px;
    --radius-sm: 4px; --radius-md: 8px;
  }
  .vd { font-family: var(--vd-body); color: var(--vd-text); }
  .vd h1, .vd h3 { font-family: 'Playfair Display', Georgia, serif; font-weight: 800; letter-spacing: -0.025em; margin: 0; }
  .vd h6 { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; margin: 0; }
  .vd .vd-name { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; letter-spacing: -0.01em; }
  .vd h6 { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
  .vd .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .vd .muted { color: var(--vd-muted); }
  .vd .plate { border: 6px solid var(--vd-surface); background: var(--vd-surface); display: block; }
  .vd .vd-btn { font-family: var(--vd-body); font-weight: 400; font-size: 14px; background: transparent;
    border: 1px solid var(--vd-divider); color: var(--vd-text); border-radius: 4px; padding: 11px 20px;
    transition: transform .3s var(--vd-ease), border-color .3s ease, background .3s ease; }
  .vd .vd-btn:hover { transform: translateY(-1px); }
  .vd .vd-btn:active { transform: translateY(1px); }
  .vd .vd-btn-red { color: var(--brand-red-700); border-color: var(--brand-red); }
  .vd .vd-btn-red:hover { background: rgba(232,68,60,0.06); }
  .vd .vd-btn-gold { color: var(--vd-gold-700); border-color: var(--vd-gold); }
  .vd .vd-btn-gold:hover { background: rgba(182,130,53,0.08); }
  .vd .vd-btn-block { display: block; width: 100%; }
  .vd .vd-card { border: 1px solid var(--vd-divider); border-radius: 4px; background: transparent;
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
    transition: transform .3s var(--vd-ease), border-color .3s ease, box-shadow .3s ease; }
  .vd .vd-card-hover:hover { transform: translateY(-4px); border-color: var(--brand-red); box-shadow: 0 6px 18px rgba(32,31,29,0.08); }
  .vd .vd-sec-title { color: var(--brand-red-700); border-bottom: 2px solid var(--brand-red); padding-bottom: 4px; align-self: flex-start; }
  /* ===== Tarjeta de repuesto · rejilla de 4 columnas (pantalla 3a) ===== */
  .vd .vd-grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
  .vd .card-kicker { font-weight:700; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--brand-red-700); }
  .vd .text-muted { color:var(--vd-muted); }
  .vd .vd-price { font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:19px;
    letter-spacing:-.02em; margin:0; font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
  .vd .vd-price-old { color:var(--vd-muted); font-size:12px; margin:0; text-decoration:line-through;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
  /* ===== Hero pantalla 3a ===== */
  .vd-hero { position:relative; background:#1A1817; overflow:hidden; }
  .vd-hero-grid { display:grid; grid-template-columns:1.05fr 1fr; gap:var(--space-8); align-items:center; padding:var(--space-8); position:relative; }
  .vd-hero::before { content:''; position:absolute; top:0; left:0; width:100%; height:3px; background:var(--brand-red); transform:scaleX(0); transform-origin:left; animation:vdRule 0.8s var(--vd-ease) 0.6s forwards; }
  .vd-hero-copy { display:flex; flex-direction:column; justify-content:center; gap:18px; position:relative; z-index:2; }
  .vd-hero-kicker { font-family:'Playfair Display',Georgia,serif; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--brand-red-700); font-variant-numeric:tabular-nums; margin:0; }
  .vd .vd-hero-title { font-family:'Cormorant Garamond',Georgia,serif; font-weight:400; font-size:50px; line-height:1.05; color:#fff; margin:0; letter-spacing:-.01em; }
  .vd-hero-sub { font-family:'Lora',Georgia,serif; font-size:16px; line-height:1.55; color:rgba(255,255,255,.86); text-align:justify; max-width:44ch; margin:0; }
  .vd-hero-ctas { display:flex; gap:12px; flex-wrap:wrap; margin-top:4px; }
  .vd-hero-plate .plate { width:100%; height:290px; object-fit:cover; object-position:center 65%; display:block; border:0; padding:0; background:transparent; animation:vdPlate 1s var(--vd-ease) 0.15s both; }
  .vd .vd-hero .btn-primary { background:transparent; color:var(--brand-red); border:1px solid var(--brand-red); padding:11px 20px; }
  .vd .vd-hero-ctas .btn-primary { background:transparent; color:var(--brand-red); border:1px solid var(--brand-red); padding:11px 20px; }
  .btn-secondary { background:transparent; border:1px solid var(--brand-red); color:var(--brand-red); border-radius:6px; padding:11px 20px; font-size:14px; transition:filter .15s; }
  .btn-secondary:hover { filter:brightness(.94); }

  @media (max-width:900px) { .vd .vd-grid-4 { grid-template-columns:1fr 1fr; gap:14px; } }
  @media (max-width:520px) { .vd .vd-grid-4 { gap:10px; } }
  /* Recta de tarjetas: altura igual entre filas, nombre de 2 lineas y CTA pegado abajo */
  .vd .vd-grid-4 > .vd-card { height:100%; }
  .vd .vd-grid-4 .vd-card-name { min-height:2.7em; }
  .vd .vd-grid-4 .vd-card-cta { margin-top:auto; }
  .vd .vd-red-icon { filter: invert(31%) sepia(64%) saturate(2200%) hue-rotate(338deg) brightness(93%) contrast(92%); }
  .vd input, .vd select { font-family: var(--vd-body); }
  .vd input:focus, .vd select:focus { outline: none; }
  @keyframes vdUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes vdPlate { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
  @keyframes vdRule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes vdMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes vdPulse { 0% { box-shadow:0 0 0 0 rgba(37,211,102,.45); } 70% { box-shadow:0 0 0 14px rgba(37,211,102,0); } 100% { box-shadow:0 0 0 0 rgba(37,211,102,0); } }
  .vd-topbar { background:#F4867F; color:#fff; padding:8px 24px; font-family:var(--vd-body); font-size:12px; letter-spacing:.04em; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .vd-topbar .vd-tb-contact { display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .vd-topbar .vd-tb-item { display:flex; align-items:center; gap:7px; }
  .vd-topbar .vd-tb-item img { width:14px; height:14px; filter:brightness(0) invert(1); opacity:.9; }
  @media (max-width:720px) { .vd-topbar { justify-content:center; text-align:center; gap:6px; } .vd-topbar .vd-tb-contact { justify-content:center; gap:14px; } }
  .vd-topbar a { color:#fff; text-decoration:underline; text-underline-offset:3px; }
  /* ===== Barra de navegacion optimizada (Paso 1) ===== */
  .vd-hdr { background:var(--vd-surface); border-bottom:1px solid var(--vd-divider); padding:10px 24px; }
  .vd-hdr-inner { max-width:1440px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-3) var(--space-4); }
  .vd-hdr a { font-family:var(--font-body); font-weight:600; font-size:13.5px; color:var(--color-text); cursor:pointer; white-space:nowrap; text-decoration:none; }
  .vd-hdr a:hover { color:var(--brand-red-700); }

  /* Logotipo + wordmark */
  .vd-brand { display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .vd-brand-logo { width:58px; height:58px; object-fit:cover; border-radius:var(--radius-sm); background:#fff; display:block; flex:0 0 auto; }
  .vd-wordmark { font-family:var(--font-heading); font-weight:600; font-size:25px; line-height:1; letter-spacing:.05em; white-space:nowrap; }
  .vd-wm-a { color:var(--brand-red); }
  .vd-wm-b { color:var(--brand-red-700); font-size:.8em; letter-spacing:.08em; margin-left:4px; }

  /* Enlaces + buscador + pedido */
  .vd-nav { display:flex; align-items:center; gap:var(--space-4); margin-left:auto; flex-wrap:wrap; }
  .vd-nav-links { display:flex; align-items:center; gap:var(--space-4); }

  .vd-nav-search { display:flex; align-items:center; gap:var(--space-2); border:1px solid var(--color-divider); border-radius:var(--radius-md); padding:5px var(--space-2); min-width:210px; background:#fff; transition:border-color .2s ease, box-shadow .2s ease; }
  .vd-nav-search:focus-within { border-color:var(--brand-red); box-shadow:0 0 0 3px rgba(232,68,60,.10); }
  .vd-nav-search img { width:15px; height:15px; opacity:.45; flex:0 0 auto; }
  .vd-nav-search input.input { flex:1 1 auto; width:100%; min-width:0; border:0; background:transparent; padding:0; height:24px; font-family:var(--font-body); font-size:13px; color:var(--color-text); -webkit-appearance:none; appearance:none; }
  .vd-nav-search input.input:focus { border:0; outline:none; }
  .vd-nav-search input.input::placeholder { color:var(--color-muted); opacity:.9; }

  .vd-order { display:inline-flex; align-items:center; font-family:var(--font-body); font-size:13.5px; font-weight:600; color:var(--color-text); cursor:pointer; white-space:nowrap; font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
  .vd-order:hover { color:var(--brand-red-700); }
  .vd-wa { position:fixed; right:22px; bottom:22px; z-index:900; width:58px; height:58px; border-radius:999px; background:#25D366; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(20,30,40,.28); animation:vdPulse 2.6s ease-out infinite; transition:transform .3s var(--vd-ease); }
  .vd-wa:hover { transform:scale(1.07); }
  .vd-seals { background:var(--vd-surface); border-top:1px solid var(--vd-divider); border-bottom:1px solid var(--vd-divider); display:flex; align-items:center; justify-content:space-evenly; flex-wrap:wrap; gap:20px; padding:14px 24px; }
  .vd-seals span { font-family:'Playfair Display',Georgia,serif; font-weight:600; font-size:12.5px; color:var(--vd-text); white-space:nowrap; }
  /* Entre 721 y 1000 px la fila 1 queda en marca + Pedido (n) y la fila 2
     junta enlaces y buscador, para que el pedido nunca salte a la izquierda. */
  @media (max-width:1000px) {
    .vd-hdr { padding:10px 16px; }
    .vd-order { margin-left:auto; }
    .vd-nav { order:20; flex-basis:100%; margin-left:0; gap:var(--space-3); }
    .vd-nav-links { gap:var(--space-3); }
    .vd-nav-search { flex:1 1 210px; min-width:180px; }
  }
  /* 360px / hasta 768px: la barra queda en logo + wordmark + Pedido (n).
     El buscador desciende a una fila propia de 44 px y los accesos
     se mantienen en una franja compacta debajo (scroll suave). */
  @media (max-width:768px) {
    .vd-topbar { font-size:11px; }
    /* 360px: la barra queda en logo + wordmark + Pedido (n).
       El buscador desciende a una fila propia de 44 px y los accesos
       se mantienen en una franja compacta debajo (si se prefiere la
       barra totalmente limpia, basta ocultar .vd-nav-links). */
    .vd-hdr { padding:8px 14px; }
    .vd-hdr-inner { gap:10px; }
    .vd-brand { gap:9px; }
    .vd-brand-logo { width:46px; height:46px; }
    .vd-wordmark { font-size:17px; }
    .vd-order { margin-left:auto; }
    .vd-nav { order:20; flex-basis:100%; margin-left:0; gap:var(--space-2); }
    .vd-nav-links { order:2; flex-basis:100%; gap:var(--space-3); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:2px 0; }
    .vd-nav-links::-webkit-scrollbar { display:none; }
    .vd-nav-links a { font-size:12.5px; }
    .vd-nav-search { order:1; width:100%; min-width:0; min-height:44px; padding:0 12px; }
    .vd-nav-search input.input { height:44px; font-size:16px; }
    .vd-seals { display:grid; grid-template-columns:1fr 1fr; justify-items:start; }
  }
  @media (max-width:768px) {
    .vd-hero-grid { grid-template-columns:1fr; gap:var(--space-4); padding:var(--space-4); }
    .vd-hero-plate { order:1; }
    .vd-hero-copy { order:2; gap:14px !important; padding:0 !important; }
    .vd .vd-hero-title { font-size:32px !important; }
    .vd-hero-sub { font-size:14px !important; max-width:100%; }
    .vd-hero-ctas { flex-direction:column; align-items:stretch; }
    .vd-hero-ctas .btn { width:100%; min-height:48px; }
    .vd-hero-plate .plate { height:220px; }
  }
  @media (prefers-reduced-motion: reduce) { .vd *, .vd *::before, .vd *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  @media (max-width: 720px) {
    .vd .vd-hero { grid-template-columns: 1fr !important; }
    .vd .vd-trust { grid-template-columns: 1fr !important; }
    .vd .vd-trust > div { border-right: 0 !important; }
    .vd .vd-cats, .vd .vd-grid { grid-template-columns: 1fr 1fr !important; }
    .vd .vd-advice { flex-direction: column !important; align-items: flex-start !important; }
    .vd .vd-btn { min-height: 48px; }
    .vd .vd-search { flex-wrap: wrap; }
  }
</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Playfair Display', Georgia, serif; background: #F3F4F6; color: #4A5560; min-height: 100vh; position: relative; overflow-x: hidden; }
  body::before {
    content: '';
    position: absolute;
    top: -120px; left: 50%;
    transform: translateX(-50%);
    width: 900px; height: 400px;
    background: radial-gradient(ellipse at center, rgba(232,68,60,0.16) 0%, rgba(232,68,60,0) 70%);
    filter: blur(40px);
    pointer-events: none;
    z-index: -1;
  }
  .brand { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; letter-spacing: -0.02em; }
  .accent { color: #E8443C; }
  input, select {
    width: 100%; background: #F3F4F6; border: 1px solid #D7DBE1; border-radius: 6px;
    padding: 10px 12px; color: #1A2229; font-family: 'Playfair Display', Georgia, serif; font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: #E8443C; }
  button { cursor: pointer; border: none; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; }
  .btn-primary { background: linear-gradient(135deg, #EF5A50 0%, #D6392F 100%); color: #FFF6F5; border-radius: 6px; padding: 10px 18px; font-size: 14px; transition: filter 0.15s; }
  .btn-primary:hover { filter: brightness(0.94); }
  .btn-ghost { background: transparent; border: 1px solid #D7DBE1; color: #4A5560; border-radius: 6px; padding: 8px 14px; font-size: 13px; }
  .btn-ghost:hover { border-color: #E8443C; color: #E8443C; }
  .card { background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 10px; border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 8px 24px rgba(20,30,40,0.10); }
  .product-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(20,30,40,0.12); }
  @keyframes cartBump { 0% { transform: scale(1); } 35% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .cart-bump { animation: cartBump 0.35s ease; }
  ::placeholder { color: #97A0AA; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  .hidden { display: none !important; }
  a { color: #E8443C; text-decoration: none; }
  .navlink { font-size: 13px; color: #5B6672; cursor: pointer; padding-bottom: 2px; }
  .navlink.active { color: #1A2229; border-bottom: 2px solid #E8443C; }
  .navlink:hover { color: #1A2229; }
</style>

</head>

let PRODUCTS = [];
let productsLoaded = false;

async function loadProducts() {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4000);
    const res = await fetch(API_BASE + '/api/products', { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    PRODUCTS = data.length ? data : PRODUCTS_FALLBACK;
  } catch (e) {
    PRODUCTS = PRODUCTS_FALLBACK;
  }
  PRODUCTS.forEach(p => { if (PRODUCT_IMAGES[p.code]) p.image = PRODUCT_IMAGES[p.code]; });
  productsLoaded = true;
}
const fmt = (n) => new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0}).format(n);

let currentView = 'home';
let session = null;
let publicCart = {};
let clientCart = {};
let visibleCount = 30;
const PAGE_SIZE = 30;

function activeCartRef() {
  return (session && !session.isAdmin) ? clientCart : publicCart;
}

function cartItemCount() {
  return Object.values(activeCartRef()).reduce((s,i) => s + i.qty, 0);
}

function renderNav() {
  const count = cartItemCount();
  const portal = session ? (session.isAdmin ? 'Panel admin' : 'Mi cuenta') : 'Portal clientes';

  const nav = document.getElementById('navlinks');
  if (nav) {
    // renderNav() se llama en cada cambio de carrito o de vista: no se debe
    // perder lo que el usuario alcanzo a escribir en el buscador.
    const prev = document.getElementById('search-home');
    const typed = prev ? prev.value : '';

    nav.innerHTML =
      `<div class="vd-nav-links">
         <a onclick="showView('nosotros')">Nosotros</a>
         <a onclick="showView('catalogo')">Productos</a>
         <a onclick="contactarAsesor()">Contacto</a>
         <a onclick="goPortal()">${portal}</a>
         ${session ? `<a onclick="logout()">Cerrar sesión</a>` : ''}
       </div>
       <form class="vd-nav-search" role="search" aria-label="Buscar repuesto" onsubmit="goHomeSearch(); return false;">
         <img src="${VD_ICON}search.svg" alt="" aria-hidden="true">
         <input class="input" id="search-home" type="search" name="q" autocomplete="off"
                placeholder="Referencia o pieza" aria-label="Buscar por referencia o pieza">
       </form>`;

    const next = document.getElementById('search-home');
    if (next && typed) next.value = typed;
  }

  const order = document.getElementById('vd-order');
  if (order) order.textContent = 'Pedido (' + count + ')';
}
function renderView(view) {
  currentView = view;
  renderNav();
  const app = document.getElementById('app');
  if (view === 'home') { app.innerHTML = viewHome(); fitHero(); }
  if (view === 'catalogo') { app.innerHTML = viewCatalog(); populateBrandFilter('brand-filter-pub'); renderPublicGrid(); }
  if (view === 'nosotros') app.innerHTML = viewAbout();
  if (view === 'carrito') app.innerHTML = viewCart();
  if (view === 'portal') {
    if (!session) { app.innerHTML = viewLogin(); fitFull(document.getElementById('vd-fullbleed')); }
    else if (session.isAdmin) { app.innerHTML = viewAdmin(); loadClientList(); }
    else { app.innerHTML = viewClientPortal(); populateBrandFilter('brand-filter-cli'); renderClientGrid(); }
  }
  window.scrollTo(0,0);
}

function showView(view) {
  if (view !== currentView) {
    history.pushState({ view }, '', '#' + view);
  }
  renderView(view);
}

window.addEventListener('popstate', (e) => {
  const view = (e.state && e.state.view) || 'home';
  renderView(view);
});

function viewCart() {
  const isClient = session && !session.isAdmin;
  const cart = activeCartRef();
  const items = Object.values(cart);
  const priceOf = p => isClient ? priceForClient(p.price) : p.price;
  const total = items.reduce((s,i) => s + i.qty * priceOf(i.product), 0);
  /* Proteccion de precios: sin sesion no se muestra ninguna cifra. */
  const money = !!session;

  if (!items.length) {
    return `
      <div style="text-align:center;padding:60px 20px;">
        <i class="ti ti-shopping-cart-off" style="font-size:40px;color:#C6CBD2;" aria-hidden="true"></i>
        <p style="font-size:15px;color:#1A2229;margin:16px 0 6px;">Tu carrito está vacío</p>
        <p style="font-size:13px;color:#8993A0;margin:0 0 20px;">Agrega productos desde el catálogo o el inicio.</p>
        <button class="btn-primary" onclick="showView('catalogo')">Ver catálogo</button>
      </div>
    `;
  }

  const rows = items.map(i => `
    <div class="card" style="display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;">
      <div style="width:44px;height:44px;background:#F3F4F6;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i class="ti ti-settings" style="font-size:20px;color:#C6CBD2;" aria-hidden="true"></i>
      </div>
      <div style="flex:1;min-width:0;">
        <p style="font-size:13px;font-weight:500;color:#1A2229;margin:0;line-height:1.3;">${i.product.name}</p>
        <p style="font-size:11px;color:#97A0AA;margin:2px 0 0;">Ref: ${i.product.code}${money ? ' · ' + fmt(priceOf(i.product)) + ' c/u' : ''}</p>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="btn-ghost" style="width:26px;padding:2px;" onclick="cartChangeQty(${i.product.id},-1)">-</button>
        <span style="font-size:13px;min-width:16px;text-align:center;">${i.qty}</span>
        <button class="btn-ghost" style="width:26px;padding:2px;" onclick="cartChangeQty(${i.product.id},1)">+</button>
      </div>
      ${money
        ? `<p style="font-size:14px;font-weight:600;color:#1A2229;min-width:70px;text-align:right;margin:0;">${fmt(i.qty*priceOf(i.product))}</p>`
        : `<p style="font-size:11px;color:#97A0AA;min-width:70px;text-align:right;margin:0;">&#8212;</p>`}
      <button onclick="cartRemove(${i.product.id})" style="background:none;border:none;color:#97A0AA;cursor:pointer;padding:4px;">
        <i class="ti ti-trash" style="font-size:16px;" aria-hidden="true"></i>
      </button>
    </div>
  `).join('');

  return `
    <p style="font-size:18px;font-weight:600;color:#1A2229;margin-bottom:16px;">Tu carrito</p>
    ${rows}
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:16px;margin-top:12px;">
      <div>
        <p style="font-size:12px;color:#8993A0;margin:0;">Total</p>
        ${money
          ? `<p style="font-size:20px;font-weight:700;color:#1A2229;margin:0;">${fmt(total)}</p>`
          : `<p style="font-size:14px;color:#8993A0;margin:0;">Precio para clientes</p>`}
      </div>
      <button class="btn-primary" onclick="cartCheckout()">Finalizar pedido</button>
    </div>
    <div id="checkout-msg-cart" style="font-size:13px;color:#7BC97B;text-align:center;margin-top:16px;"></div>
  `;
}

function cartChangeQty(id, delta) {
  const cart = activeCartRef();
  const p = PRODUCTS.find(x => x.id === id);
  if (!cart[id]) cart[id] = {qty:0, product:p};
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  showView('carrito');
}

function cartRemove(id) {
  delete activeCartRef()[id];
  showView('carrito');
}

async function cartCheckout() {
  const isClient = session && !session.isAdmin;
  if (isClient) { await checkoutClientFrom('checkout-msg-cart'); }
  else { await checkoutPublicFrom('checkout-msg-cart'); }
}

/* El catálogo no trae categoría, así que se deduce del nombre de la pieza. */
const VD_CATEGORIES = [
  { name: 'Motor',       icon: 'cog.svg',         test: /bomba|inyector|piston|anillo|culata|arbol|cigue|valvula|empaque|turbo|exosto/i },
  { name: 'Embrague',    icon: 'disc.svg',        test: /embrague|clutch|prensa|balinera|collarin/i },
  { name: 'Frenos',      icon: 'circle-stop.svg', test: /freno|banda|pastilla|campana|zapata/i },
  { name: 'Filtros',     icon: 'filter.svg',      test: /filtro|aire|racor/i },
  { name: 'Transmisión', icon: 'git-fork.svg',    test: /caja|cardan|corona|pi[ñn]on|diferencial|homocinetica|transmis/i }
];

function vdCategoryCounts() {
  const counts = {};
  VD_CATEGORIES.forEach(c => counts[c.name] = 0);
  PRODUCTS.forEach(pr => { const c = VD_CATEGORIES.find(c => c.test.test(pr.name || '')); if (c) counts[c.name]++; });
  return counts;
}

function vdCategory(name) {
  showView('catalogo');
  setTimeout(() => {
    document.getElementById('search-pub').value = name;
    visibleCount = PAGE_SIZE;
    renderPublicGrid();
  }, 0);
}

function vdFeatured() {
  const conFoto = PRODUCTS.filter(pr => pr.image);
  const resto = PRODUCTS.filter(pr => !pr.image);
  return conFoto.concat(resto).slice(0, 8);
}

function vdAdd(evt, id) {
  const pr = PRODUCTS.find(x => x.id === id);
  if (!pr) return;
  const ref = activeCartRef();
  if (!ref[id]) ref[id] = { qty: 0, product: pr };
  ref[id].qty += 1;
  renderNav();
  const btn = evt.currentTarget;
  const antes = btn.textContent;
  btn.textContent = 'Agregado';
  setTimeout(() => { btn.textContent = antes; }, 900);
}

function vdProductCard(pr) {
  /* Proteccion de precios: el invitado nunca ve una cifra. El cliente ve su
     precio con descuento (mismo calculo que el resto del sitio). */
  const logged = !!session;
  const isClient = !!session && !session.isAdmin;
  const price = isClient ? priceForClient(pr.price) : pr.price;
  const desc = isClient ? (session.discount || 0) : 0;

  return `
    <div class="vd-card vd-card-hover">
      ${pr.image
        ? `<img class="plate" src="${pr.image}" alt="${pr.name}" style="width:100%;height:92px;object-fit:cover;">`
        : `<div class="plate" style="width:100%;height:92px;display:flex;align-items:center;justify-content:center;"><img src="${VD_ICON}cog.svg" alt="" style="width:26px;height:26px;opacity:.35;"></div>`}
      <span class="card-kicker">${pr.brand}</span>
      <p class="vd-card-name">${pr.name}</p>
      <p class="num muted" style="font-size:12px;margin:0;">Ref. ${pr.code}</p>
      ${logged
        ? `<p class="vd-price">${fmt(price)}</p>${desc > 0 ? `<p class="vd-price-old">${fmt(pr.price)}</p>` : ''}`
        : `<div class="text-muted" style="font-size:12px;">Precio para clientes</div>`}
      <button class="vd-btn vd-btn-red vd-btn-block vd-card-cta" style="padding:8px;font-size:13px;" onclick="vdAdd(event, ${pr.id})">Agregar</button>
    </div>`;
}
function fitFull(el) {
  if (!el) return;
  const tb = document.querySelector('.vd-topbar');
  const hd = document.querySelector('.vd-hdr');
  const chrome = (tb ? tb.offsetHeight : 0) + (hd ? hd.offsetHeight : 0);
  el.style.minHeight = Math.max(420, window.innerHeight - chrome) + 'px';
}
window.addEventListener('resize', () => fitFull(document.getElementById('vd-fullbleed')));

function fitHero() {
  const hero = document.getElementById('vd-hero');
  if (!hero) return;
  const tb = document.querySelector('.vd-topbar');
  const hd = document.querySelector('.vd-hdr');
  const sl = document.querySelector('.vd-seals');
  const chrome = (tb ? tb.offsetHeight : 0) + (hd ? hd.offsetHeight : 0) + (sl ? sl.offsetHeight : 0);
  hero.style.height = Math.max(420, window.innerHeight - chrome) + 'px';
}
window.addEventListener('resize', fitHero);
window.addEventListener('load', fitHero);

async function handleLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const errorEl = document.getElementById('login-error');
  if (!u || !p) { errorEl.textContent = 'Completa usuario y contraseña.'; return; }
  errorEl.style.color = '#E8443C';
  errorEl.textContent = 'Conectando...';
  try {
    const res = await fetch(API_BASE + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (!res.ok) { errorEl.textContent = data.error || 'No se pudo iniciar sesión.'; return; }
    session = { ...data, password: p };
    clientCart = {};
    errorEl.textContent = '';
    showView('portal');
  } catch (e) {
    errorEl.textContent = 'No se pudo conectar al servidor. Si acaba de despertar, espera unos segundos e intenta de nuevo.';
  }
}

async function createClient() {
  const u = document.getElementById('new-user').value.trim();
  const p = document.getElementById('new-pass').value.trim();
  const c = document.getElementById('new-company').value.trim() || u;
  const d = parseFloat(document.getElementById('new-discount').value) || 0;
  const m=document.getElementById('admin-msg');
  if (!u || !p) { m.style.color='#E8443C'; m.textContent='Usuario y contraseña son obligatorios.'; return; }
  try {
    const res = await fetch(API_BASE + '/api/admin/clients', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        adminUsername: session.username, adminPassword: session.password,
        username: u, password: p, company: c, discount: d
      })
    });
    const data = await res.json();
    if (!res.ok) { m.style.color='#E8443C'; m.textContent = data.error || 'No se pudo crear el cliente.'; return; }
    m.style.color='#7BC97B'; m.textContent='Cliente "' + u + '" creado.';
    document.getElementById('new-user').value=''; document.getElementById('new-pass').value='';
    document.getElementById('new-company').value=''; document.getElementById('new-discount').value='';
    loadClientList();
  } catch(e) {
    m.style.color='#E8443C';
    m.textContent = 'No se pudo conectar al servidor.';
  }
}

async function loadClientList() {
  try {
    const params = new URLSearchParams({ adminUsername: session.username, adminPassword: session.password });
    const res = await fetch(API_BASE + '/api/admin/clients?' + params);
    const clients = await res.json();
    const rows = clients.map(u =>
      '<tr><td style="padding:6px 0;">' + u.username + '</td><td>' + u.company + '</td><td>' + u.discount + '%</td></tr>'
    );
    document.getElementById('client-list').innerHTML = rows.length
      ? '<table style="width:100%;border-collapse:collapse;"><tr style="color:#8993A0;font-size:11px;text-align:left;"><td>Usuario</td><td>Empresa</td><td>Descuento</td></tr>' + rows.join('') + '</table>'
      : 'Aún no hay clientes registrados.';
  } catch(e) { document.getElementById('client-list').innerHTML = 'No se pudo conectar al servidor.'; }
  loadOrderList();
}

async function loadOrderList() {
  try {
    const params = new URLSearchParams({ adminUsername: session.username, adminPassword: session.password });
    const res = await fetch(API_BASE + '/api/admin/orders?' + params);
    const orders = await res.json();
    const rows = orders.map(o => {
      const date = new Date(o.created_at).toLocaleString('es-CO');
      return '<tr><td style="padding:6px 0;">' + date + '</td><td>' + (o.company||o.username) + '</td><td>' + o.items.length + ' items</td><td>' + fmt(o.total) + '</td></tr>';
    });
    document.getElementById('order-list').innerHTML = rows.length
      ? '<table style="width:100%;border-collapse:collapse;"><tr style="color:#8993A0;font-size:11px;text-align:left;"><td>Fecha</td><td>Cliente</td><td>Items</td><td>Total</td></tr>' + rows.join('') + '</table>'
      : 'Aún no hay pedidos.';
  } catch(e) { document.getElementById('order-list').innerHTML = 'No se pudo conectar al servidor.'; }
}

function populateBrandFilter(id) {
  const sel = document.getElementById(id);

  brands.forEach(b => { opts += '<option value="' + b + '">' + b + '</option>'; });

function getFiltered(searchId, brandId) {
  const q = document.getElementById(searchId).value.trim().toLowerCase();
  const brand = document.getElementById(brandId).value;
  return PRODUCTS.filter(p => {
    const matchBrand = !brand || p.brand === brand;
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q);
    return matchBrand && matchQ;
  });
}

function bumpCartIcon(id) {
  const el = document.getElementById(id);

  el.classList.remove('cart-bump');

function changeQtyPublic(id, delta) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!publicCart[id]) publicCart[id] = {qty:0, product:p};
  publicCart[id].qty += delta;
  if (publicCart[id].qty <= 0) delete publicCart[id];
  renderPublicGrid();
  renderNav();
  if (delta > 0) bumpCartIcon('pub-cart-count');
}

function updateCartSummaryPublic() {
  const items = Object.values(publicCart);
  const count = items.reduce((s,i)=>s+i.qty,0);
  const total = items.reduce((s,i)=>s+i.qty*i.product.price,0);
  document.getElementById('pub-cart-count').textContent = count + (count===1?' item':' items');
  document.getElementById('pub-cart-total').textContent = session ? fmt(total) : 'Precio para clientes';
}

const WHATSAPP_NUMBER = '573150300954';

function contactarAsesor() {
  const msg = '¡Hola! Quisiera hablar con un asesor sobre repuestos';
  window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');
}

function buildWhatsAppMessage(order) {
  /* Proteccion de precios: al invitado se le envian piezas y referencias sin
     cifras y el asesor responde con la cotizacion. El cliente registrado si ve
     sus precios con descuento. */
  const guest = order.username === 'invitado';
  const lines = order.items.map(function (i) {
    return '- ' + i.qty + 'x ' + i.name + ' (Ref: ' + i.code + ')'
      + (guest ? '' : ' \u2014 ' + fmt(i.price * i.qty));
  });
  const header = guest
    ? 'Hola, quiero cotizar este pedido:'
    : 'Hola, soy ' + order.company + '. Quiero coordinar el pago de mi pedido:';
  const footer = guest
    ? 'Quedo pendiente del precio y de la coordinacion de pago y despacho.'
    : 'Total: ' + fmt(order.total);
  return header + '\n\n' + lines.join('\n') + '\n\n' + footer;
}

function redirectToWhatsApp(order) {
  const msg = buildWhatsAppMessage(order);
  const url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg);
  window.location.href = url;
}

function showWhatsAppModal(order) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,20,26,0.75);display:flex;align-items:center;justify-content:center;z-index:9999;';
  overlay.innerHTML = `
    <div class="card" style="max-width:320px;padding:28px 24px;text-align:center;">
      <i class="ti ti-brand-whatsapp" style="font-size:32px;color:#7BC97B;display:block;margin-bottom:12px;" aria-hidden="true"></i>
      <p style="font-size:15px;color:#1A2229;margin:0 0 8px;">${order.username === 'invitado'
        ? 'Pedido registrado'
        : 'Pedido registrado por ' + fmt(order.total)}</p>
      <p style="font-size:13px;color:#8993A0;margin:0;">Te vamos a llevar a WhatsApp para coordinar el pago y el despacho...</p>
    </div>
  `;
  document.body.appendChild(overlay);
  setTimeout(() => {
    redirectToWhatsApp(order);
  }, 1800);
}

async function checkoutPublicFrom(msgId) {

  const order = { username:'invitado', company:'Cliente sin cuenta', items: items.map(i=>({name:i.product.name, code:i.product.code, qty:i.qty, price:i.product.price})), total };
  m.style.color='#5B6672'; m.textContent='Enviando pedido...';
  try {
    const res = await fetch(API_BASE + '/api/orders', {
      method: 'POST',

  }
}
